<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HK Trip 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
:root{ color-scheme:light only;
  --bg:#FAF7F0;--sf:#F0E8DC;--card:#FFFFFF;--bd:#E8DDD0;
  --p:#6B4C3B;--sc:#C4956A;--t:#3D2B1F;--ts:#7A6555;--tm:#A8907E;
  --wb:#FFF4EC;--wt:#C4714A;--gb:#F0F5E8;--gt:#4A7A2A;
  --r:12px;--shadow:0 2px 10px rgba(61,43,31,.09);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);font-family:'Noto Serif TC',serif;font-weight:700;max-width:430px;margin:0 auto;min-height:100vh;overflow-x:hidden}
#app{display:flex;flex-direction:column;min-height:100vh;padding-bottom:66px}
#main-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* NAV */
#bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--card);border-top:1px solid var(--bd);display:flex;z-index:100;box-shadow:0 -2px 12px rgba(61,43,31,.08);padding-bottom:env(safe-area-inset-bottom,0)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0 8px;cursor:pointer;gap:2px;border:none;background:none;color:var(--tm);font-size:10px;font-family:inherit;font-weight:700;transition:color .2s}
.nav-item.active{color:var(--p)}
.nav-icon{font-size:22px;line-height:1.1}

/* COMMON */
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--bd);box-shadow:var(--shadow);padding:16px;margin:10px 16px}
.sec-hd{font-size:11px;font-weight:900;color:var(--ts);text-transform:uppercase;letter-spacing:.8px;padding:14px 16px 6px}
.page-hd{background:linear-gradient(135deg,var(--p) 0%,#8B5A42 100%);color:white;padding:20px 16px 18px;display:flex;justify-content:space-between;align-items:flex-start}
.page-hd-title{font-size:20px;font-weight:900;letter-spacing:.5px}
.btn{padding:10px 20px;border-radius:8px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s}
.btn:active{opacity:.7}
.btn-p{background:var(--p);color:white}
.btn-s{background:var(--sf);color:var(--t);border:1px solid var(--bd)}
.btn-ghost{background:rgba(255,255,255,.2);border:none;color:white;padding:6px 14px;border-radius:16px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.inp{width:100%;padding:10px 12px;border:1.5px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--t);font-family:inherit;font-size:14px;font-weight:700;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--sc)}
.pill-wrap{display:flex;gap:8px;padding:12px 16px;overflow-x:auto}
.pill-wrap::-webkit-scrollbar{display:none}
.pill{padding:8px 18px;border-radius:20px;border:1.5px solid var(--bd);background:var(--card);color:var(--ts);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s;white-space:nowrap}
.pill.on{background:var(--p);color:white;border-color:var(--p)}
.sync-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;opacity:.8;font-weight:700}
.sdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.sd-ok{background:#6abf69}.sd-ing{background:var(--sc);animation:blink 1s infinite}.sd-err{background:var(--wt)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.bgt-bar{height:7px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden;margin-top:8px}
.bgt-fill{height:100%;background:rgba(255,255,255,.65);border-radius:4px;transition:width .6s}
.empty{text-align:center;padding:36px 20px;color:var(--tm)}
.empty-ico{font-size:40px;margin-bottom:12px}
.empty p{font-size:13px;font-weight:700}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:rgba(61,43,31,.92);color:white;padding:10px 22px;border-radius:22px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* HOME POSTER HEADER */
.home-hd{background:var(--sf);padding:16px;border-bottom:2px solid var(--p)}
.poster-frame{border:2.5px solid var(--p);padding:0;position:relative;overflow:hidden}
.poster-frame::after{content:'';position:absolute;inset:4px;border:1px solid var(--bd);pointer-events:none;z-index:0}
.poster-top{background:var(--p);color:white;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.poster-top-left{font-size:11px;font-weight:900;letter-spacing:1.5px;opacity:.9}
.cd-pill{background:white;color:var(--p);padding:3px 10px;border-radius:10px;font-size:11px;font-weight:900;white-space:nowrap}
.poster-main{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 14px;gap:0;position:relative;z-index:1}
.poster-zh{font-size:62px;font-weight:900;color:var(--p);line-height:1;letter-spacing:-2px;flex-shrink:0}
.poster-center{flex:1;text-align:center;padding:0 8px}
.poster-year{font-size:22px;font-weight:900;color:var(--t);letter-spacing:2px}
.poster-subtitle{font-size:13px;font-weight:700;color:var(--ts);margin-top:4px;letter-spacing:1px}
.poster-dates{font-size:11px;font-weight:700;color:var(--tm);margin-top:6px;letter-spacing:.5px}
.poster-bottom{background:var(--p);color:rgba(255,255,255,.8);padding:7px 14px;text-align:center;font-size:10px;font-weight:700;letter-spacing:2.5px;position:relative;z-index:1}
.wx-card{background:var(--card);border-radius:var(--r);border:1px solid var(--bd);padding:13px 16px;margin:0 16px 10px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.wx-temp{font-size:26px;font-weight:900;color:var(--t)}
.fl-card{background:var(--card);border-radius:var(--r);border:1px solid var(--bd);padding:12px 14px;margin:0 16px 8px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.fl-badge{background:var(--sf);padding:5px 9px;border-radius:6px;font-size:11px;font-weight:900;color:var(--p);white-space:nowrap;border:1px solid var(--bd)}
.fl-code{font-size:15px;font-weight:900;color:var(--t)}
.fl-det{font-size:11px;color:var(--ts);margin-top:2px;font-weight:700}

/* ITINERARY TIMELINE */
.day-hd-card{background:var(--sf);border-radius:10px;margin:10px 16px;padding:12px 14px;border:1px solid var(--bd)}
.day-hd-date{font-size:11px;color:var(--ts);font-weight:700;margin-bottom:2px}
.day-hd-title{font-size:14px;font-weight:900;color:var(--t)}
.tl-wrap{padding:4px 16px 8px}
.tl-item{display:flex;gap:0;position:relative}
.tl-left{display:flex;flex-direction:column;align-items:center;width:52px;flex-shrink:0}
.tl-time{font-size:11px;color:var(--ts);font-weight:700;height:20px;display:flex;align-items:center;font-variant-numeric:tabular-nums}
.tl-dot{width:10px;height:10px;border-radius:50%;background:var(--sc);border:2.5px solid var(--bg);box-shadow:0 0 0 1.5px var(--sc);flex-shrink:0;z-index:1}
.tl-line{width:2px;flex:1;background:var(--bd);min-height:20px}
.tl-body{flex:1;padding:0 8px 20px;padding-top:1px}
.tl-title{font-size:15px;font-weight:900;color:var(--t);line-height:1.3;margin-bottom:3px}
.tl-sub{font-size:12px;color:var(--ts);font-weight:700;margin-bottom:7px;line-height:1.4}
.tl-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tl-tag{padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap}
.tl-map-btn{padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700;background:#e8f0f8;color:#2c5f8a;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.tl-actions{display:flex;gap:4px;flex-direction:column;flex-shrink:0;padding-top:2px}
.tl-btn{width:28px;height:28px;border-radius:6px;border:none;background:none;color:var(--tm);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tl-btn:active{background:var(--sf)}
.tl-edit-form{background:var(--sf);border-radius:10px;padding:12px;margin-bottom:16px;border:1px solid var(--bd)}
.tl-edit-form input,.tl-edit-form select{width:100%;padding:8px 10px;border:1.5px solid var(--bd);border-radius:7px;background:var(--card);color:var(--t);font-family:inherit;font-size:13px;font-weight:700;outline:none;margin-bottom:7px}
.tl-edit-form input:focus,.tl-edit-form select:focus{border-color:var(--sc)}
.add-ev-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;border:1.5px dashed var(--bd);border-radius:10px;background:none;width:100%;color:var(--ts);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px}
.add-ev-btn:active{background:var(--sf)}

/* EXPENSE */
.exp-sum-card{background:var(--p);border-radius:var(--r);padding:18px;margin:10px 16px;color:white}
.exp-sum-total{font-size:32px;font-weight:900;line-height:1.1;margin:5px 0 3px}
.exp-sum-sub{font-size:11px;opacity:.7;font-weight:700;margin-bottom:10px}
.exp-sum-bar{height:5px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.exp-sum-fill{height:100%;background:rgba(255,255,255,.65);border-radius:3px;transition:width .6s}
.exp-cat-row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--bd);gap:10px}
.exp-cat-bar{height:4px;background:var(--sf);border-radius:2px;overflow:hidden;margin-top:4px}
.exp-cat-fill{height:100%;background:var(--sc);border-radius:2px}
.exp-rec-item{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd);gap:8px}
.exp-rec-left{flex:1}
.exp-rec-name{font-size:14px;font-weight:900;color:var(--t)}
.exp-rec-meta{font-size:11px;color:var(--ts);font-weight:700;margin-top:2px}
.exp-rec-amt{font-size:15px;font-weight:900;color:var(--t);margin-right:6px;white-space:nowrap}
.exp-rec-btn{width:32px;height:32px;border-radius:6px;border:none;background:var(--sf);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.add-exp-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;border:1.5px dashed var(--bd);border-radius:10px;background:none;width:calc(100% - 32px);margin:8px 16px;color:var(--ts);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.add-exp-btn:active{background:var(--sf)}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;opacity:0;transition:opacity .25s;pointer-events:none}
.modal-ov.show{opacity:1;pointer-events:all}
.modal-sheet{background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px 24px;width:100%;max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease;max-width:430px;margin:0 auto}
.modal-ov.show .modal-sheet{transform:translateY(0)}
.modal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-title{font-size:16px;font-weight:900;color:var(--t)}
.modal-close{width:30px;height:30px;border-radius:50%;border:none;background:var(--sf);color:var(--ts);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.calc-disp{background:var(--sf);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;border:1px solid var(--bd)}
.calc-amt{font-size:36px;font-weight:900;color:var(--t);text-align:right;min-height:44px;line-height:1;word-break:break-all}
.calc-note{width:100%;border:none;background:transparent;text-align:right;font-size:13px;font-weight:700;color:var(--ts);font-family:inherit;outline:none;margin-top:6px}
.scroll-tabs{display:flex;gap:7px;padding:0 0 8px;overflow-x:auto}
.scroll-tabs::-webkit-scrollbar{display:none}
.tab-btn{padding:6px 12px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);color:var(--ts);font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab-btn.on{background:var(--sc);color:white;border-color:var(--sc)}
.tab-btn.cat-on{background:var(--p);color:white;border-color:var(--p)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:6px}
.key{padding:15px 8px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);font-size:18px;font-family:inherit;font-weight:900;color:var(--t);cursor:pointer;text-align:center;transition:background .1s}
.key:active{background:var(--sf)}
.key-a{background:var(--sf);color:var(--ts);font-size:14px}
.key-ok{background:var(--p);color:white;border-color:var(--p);font-size:14px}
.key-ok:active{background:var(--sc)}

/* PACKING */
.cat-hd{background:var(--sf);padding:8px 14px;font-size:10px;font-weight:900;color:var(--ts);letter-spacing:.8px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.cat-add-btn{background:var(--p);color:white;border:none;border-radius:50%;width:20px;height:20px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;font-weight:900;line-height:1;flex-shrink:0}
.pk-item{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--bd);gap:10px}
.pk-chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .2s;font-size:12px;font-weight:900}
.pk-chk.on{background:var(--p);border-color:var(--p);color:white}
.pk-lbl{flex:1;font-size:13px;color:var(--t);font-weight:700;line-height:1.4}
.pk-lbl.done{color:var(--tm);text-decoration:line-through}
.pk-edit-form{padding:10px 14px;background:var(--wb);border-bottom:1px solid var(--bd)}
.pk-edit-form input{width:100%;padding:8px 10px;border:1.5px solid var(--bd);border-radius:7px;background:var(--card);color:var(--t);font-family:inherit;font-size:13px;font-weight:700;outline:none;margin-bottom:7px}
.pk-edit-form input:focus{border-color:var(--sc)}
.pk-add-form{padding:10px 14px;background:#f8f8f0;border-bottom:1px solid var(--bd)}
.pk-add-form input{width:100%;padding:8px 10px;border:1.5px solid var(--sc);border-radius:7px;background:var(--card);color:var(--t);font-family:inherit;font-size:13px;font-weight:700;outline:none;margin-bottom:7px}

/* MORE */
.ct-item{background:var(--card);border-radius:10px;padding:13px 14px;margin-bottom:8px;border:1px solid var(--bd);box-shadow:var(--shadow)}
.ct-icon{font-size:22px;flex-shrink:0;width:32px;text-align:center}
.ct-name{font-size:14px;font-weight:900;color:var(--t)}
.ct-tel{font-size:13px;color:var(--sc);font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.ct-sub{font-size:11px;color:var(--tm);font-weight:700;margin-top:2px}
.memo-ta{width:100%;min-height:150px;border:1.5px solid var(--bd);border-radius:var(--r);background:var(--card);color:var(--t);font-family:inherit;font-size:14px;font-weight:700;padding:12px;resize:vertical;outline:none;line-height:1.7}
.memo-ta:focus{border-color:var(--sc)}
.mtr-tbl{width:100%;border-collapse:collapse;font-size:12px}
.mtr-tbl th{background:var(--sf);padding:8px 10px;text-align:left;color:var(--ts);font-weight:900;font-size:10px;letter-spacing:.5px}
.mtr-tbl td{padding:8px 10px;border-bottom:1px solid var(--bd);color:var(--t);font-weight:700}

@media(prefers-color-scheme:dark){
  :root{ background:#FAF7F0!important;color:#3D2B1F!important }
  body,#app,#main-content{ background:#FAF7F0!important;color:#3D2B1F!important }
  .card,.modal-sheet,.calc-disp,.exp-sum-card{ filter:none!important }
}

/* ── Portrait lock ── */
#rotate-hint{
  display:none;position:fixed;inset:0;z-index:9999;
  background:var(--bg);flex-direction:column;
  align-items:center;justify-content:center;gap:16px;
  font-family:'Noto Serif TC',serif;
}
@media(orientation:landscape){
  #rotate-hint{display:flex!important}
  #app{display:none!important}
}
</style>
</head>

<script>

/* FIREBASE */
let _st=null,_sk=false;
function saveToFb(){
  if(!tripRef)return;clearTimeout(_st);
  _st=setTimeout(async()=>{
    setSS('syncing');
    try{_sk=true;await tripRef.set({itinerary:S.itinerary,expenses:S.expenses,packing:S.packing,memo:S.memo,tips:S.tips,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});setSS('synced');}
    catch(e){console.error(e);setSS('error');}
  },800);
}
function initFbSync(){
  if(!tripRef)return;
  tripRef.onSnapshot(doc=>{
    if(_sk){_sk=false;return;}
    if(!doc.exists){S.itinerary=JSON.parse(JSON.stringify(DEFAULT_ITINERARY));S.packing=JSON.parse(JSON.stringify(DEFAULT_PACKING));saveToFb();return;}
    const d=doc.data();
    if(d.itinerary)S.itinerary={1:d.itinerary['1']||d.itinerary[1]||[],2:d.itinerary['2']||d.itinerary[2]||[],3:d.itinerary['3']||d.itinerary[3]||[]};
    if(d.expenses)S.expenses=d.expenses;
    if(d.packing)S.packing=d.packing;
    if(d.memo!==undefined)S.memo=d.memo;
    if(d.tips!==undefined)S.tips=d.tips;
    setSS('synced');renderCurrentTab();
  },e=>{console.error(e);setSS('error');});
}
function setSS(s){
  S.syncStatus=s;const el=document.getElementById('sync-status');if(!el)return;
  const m={idle:'連線中',syncing:'同步中…',synced:'已同步',error:'同步失敗'};
  const dc={idle:'sd-ok',syncing:'sd-ing',synced:'sd-ok',error:'sd-err'};
  el.innerHTML=`<span class="sdot ${dc[s]}"></span>${m[s]}`;
}

/* WEATHER */
async function fetchWeather(){
  try{const r=await fetch('https://wttr.in/Hong+Kong?format=j1');const d=await r.json();const c=d.current_condition[0];S.weather={temp:c.temp_C,feelsLk:c.FeelsLikeC,desc:c.weatherDesc[0].value,hum:c.humidity,icon:wxIcon(parseInt(c.weatherCode))};}
  catch(e){S.weather={temp:'--',feelsLk:'--',desc:'無法載入',hum:'--',icon:'🌤️'};}
  if(S.tab==='home')renderHome();
}
function wxIcon(c){if(c===113)return'☀️';if(c<=116)return'🌤️';if(c<=119)return'⛅';if(c>=200&&c<300)return'⛈️';if(c>=300&&c<500)return'🌧️';return'🌦️';}

function renderItinerary(){

    if(!a.time&&!b.time)return 0;

  });
  const tl=evs.map((e,i)=>{
    if(S.evEditId===e.id){
      return`<div class="tl-item"><div class="tl-left"><div class="tl-time"></div><div class="tl-dot" style="background:var(--sc)"></div>${i<evs.length-1?'<div class="tl-line"></div>':''}</div>

      </div></div></div>`;
    }
    const ts=TAG_STYLE[e.tag]||TAG_STYLE[''];
    const mapQ=encodeURIComponent(e.title+' 香港');
    const mapBtn=e.tag&&!['航班','入境'].includes(e.tag)?`<a href="https://maps.google.com/?q=${mapQ}" target="_blank" class="tl-map-btn">📍 地圖</a>`:'';

      <div class="tl-left"><div class="tl-time">${e.time||''}</div><div class="tl-dot"></div>${i<evs.length-1?'<div class="tl-line"></div>':''}</div>

      </div>
      ${S.itinEditMode?`<div class="tl-actions">
          <button class="tl-btn" onclick="S.evEditId=${e.id};S.showAddEv=false;renderItinerary()">✏️</button>
          <button class="tl-btn" onclick="moveEv(${e.id},'up')" ${i===0?'style="opacity:.3;pointer-events:none"':''}>▲</button>
          <button class="tl-btn" onclick="moveEv(${e.id},'dn')" ${i===evs.length-1?'style="opacity:.3;pointer-events:none"':''}>▼</button>
          <button class="tl-btn" style="color:var(--wt)" onclick="delEv(${e.id})">🗑️</button>

  const addForm=S.showAddEv?`<div class="tl-edit-form" style="margin:8px 0">
    <div style="display:flex;gap:8px;margin-bottom:7px">
      <input type="time" id="ae-time" value="${S.newEvTime}" oninput="S.newEvTime=this.value" style="width:110px;flex-shrink:0;margin-bottom:0">

    </div>

    <div style="display:flex;gap:8px">
      <button class="btn btn-p" style="flex:1;padding:9px" onclick="addEv()">新增 ✓</button>

  const catTotals={};EXP_CATS.forEach(c=>{catTotals[c.id]=S.expenses.filter(e=>e.cat===c.id).reduce((s,e)=>s+e.amount*(EX_RATES[e.currency]||1),0);});
  const maxCat=Math.max(...Object.values(catTotals),1);

  const catH=usedCats.length?`<div class="sec-hd">分類統計</div><div class="card" style="padding:0;overflow:hidden">${usedCats.map(c=>`<div class="exp-cat-row"><div style="flex:1"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:13px;font-weight:700">${c.icon} ${c.lbl}</span><span style="font-size:13px;font-weight:900;color:var(--t)">NT$ ${fmt(Math.round(catTotals[c.id]))}</span></div><div class="exp-cat-bar"><div class="exp-cat-fill" style="width:${Math.round(catTotals[c.id]/maxCat*100)}%"></div></div></div></div>`).join('')}</div>`:'';

function openExpModal(editId){

  else{S.calcInput='0';S.calcNote='';}
  renderExpModal();document.getElementById('exp-modal').classList.add('show');
}

/* ACTIONS */
function go(tab){S.tab=tab;render();window.scrollTo(0,0);}
function switchDay(d){S.day=d;S.showAddEv=false;S.evEditId=null;S.itinEditMode=false;renderItinerary();}
function addEv(){
  const t=document.getElementById('ae-title')?.value||S.newEvTitle;
  if(!t.trim()){showToast('請輸入標題');return;}
  const sub=document.getElementById('ae-sub')?.value||'';
  const time=document.getElementById('ae-time')?.value||'';
  const tag=document.getElementById('ae-tag')?.value||S.newEvTag;
  (S.itinerary[S.day]=S.itinerary[S.day]||[]).push({id:Date.now(),time,title:t.trim(),sub:sub.trim(),tag});
  S.showAddEv=false;S.newEvTitle='';S.newEvSub='';S.newEvTime='';
  saveToFb();renderItinerary();
}
function saveEvEdit(id){
  const ev=(S.itinerary[S.day]||[]).find(e=>e.id===id);if(!ev)return;
  ev.time=document.getElementById('ee-time')?.value||'';
  ev.title=document.getElementById('ee-title')?.value||ev.title;
  ev.sub=document.getElementById('ee-sub')?.value||'';
  ev.tag=document.getElementById('ee-tag')?.value||'';
  S.evEditId=null;saveToFb();renderItinerary();
}

function moveEv(id,dir){
  const raw=S.itinerary[S.day]||[];
  const sorted=[...raw].sort((a,b)=>{
    if(!a.time&&!b.time)return 0;if(!a.time)return 1;if(!b.time)return -1;
    return a.time.localeCompare(b.time);
  });
  const idx=sorted.findIndex(e=>e.id===id);
  const ni=dir==='up'?idx-1:idx+1;
  if(ni<0||ni>=sorted.length)return;
  const iA=raw.find(e=>e.id===sorted[idx].id);
  const iB=raw.find(e=>e.id===sorted[ni].id);
  [iA.time,iB.time]=[iB.time,iA.time];
  saveToFb();renderItinerary();
}
function delEv(id){if(!confirm('確定刪除？'))return;S.itinerary[S.day]=(S.itinerary[S.day]||[]).filter(e=>e.id!==id);saveToFb();renderItinerary();}
function kp(k){if(S.calcInput==='0'||S.calcInput===''){S.calcInput=k==='.'?'0.':k;}else{if(k==='.'&&S.calcInput.includes('.'))return;if(S.calcInput.replace('.','').length>=10)return;S.calcInput+=k;}renderExpModal();}
function kpBack(){S.calcInput=S.calcInput.length<=1?'0':S.calcInput.slice(0,-1);renderExpModal();}
function kpClear(){S.calcInput='0';S.calcNote='';renderExpModal();}
function saveExp(){
  const amt=parseFloat(S.calcInput);if(!amt||amt<=0){showToast('請先輸入金額');return;}
  if(S.calcEditId){const e=S.expenses.find(x=>x.id===S.calcEditId);if(e){e.amount=amt;e.currency=S.calcCurrency;e.cat=S.calcCat;e.note=S.calcNote.trim();}showToast('已更新 ✓');}
  else{S.expenses.push({id:'e'+Date.now(),amount:amt,currency:S.calcCurrency,cat:S.calcCat,note:S.calcNote.trim(),ts:Date.now()});showToast('已記帳 ✓');}
  closeExpModal();saveToFb();renderExpense();
}
function delExpFromModal(){if(!S.calcEditId)return;if(!confirm('確定刪除此記錄？'))return;S.expenses=S.expenses.filter(e=>e.id!==S.calcEditId);closeExpModal();saveToFb();renderExpense();}
function delExp(id){if(!confirm('確定刪除？'))return;S.expenses=S.expenses.filter(e=>e.id!==id);saveToFb();renderExpense();}
function togPack(id){const it=S.packing.find(p=>p.id===id);if(it){it.checked=!it.checked;saveToFb();renderPacking();}}
function addPackToCat(cat){
  if(!S.newPackTxt.trim())return;
  S.packing.push({id:Date.now(),cat,text:S.newPackTxt.trim(),checked:false});
  S.newPackTxt='';S.addPackCat=null;saveToFb();renderPacking();
}
function addNewCatPack(){
  S.addPackCat='其他 💫';S.newPackTxt='';S.packEditId=null;renderPacking();
  setTimeout(()=>document.getElementById('pk-cat-inp')?.focus(),80);
}
function savePackEdit(id){
  const it=S.packing.find(p=>p.id===id);if(!it)return;
  it.text=document.getElementById('pe-txt')?.value||it.text;
  it.cat=document.getElementById('pe-cat')?.value||it.cat;
  S.packEditId=null;saveToFb();renderPacking();
}
function delPack(id){if(!confirm('確定刪除？'))return;S.packing=S.packing.filter(p=>p.id!==id);saveToFb();renderPacking();}
function copyText(text,el){
  navigator.clipboard.writeText(text).then(()=>{const orig=el.style.color;el.style.color='var(--gt)';setTimeout(()=>el.style.color=orig,1200);showToast('已複製 '+text);}).catch(()=>{});
}
function mc(){return document.getElementById('main-content');}
function fmt(n){return Number(n).toLocaleString();}
function fmtAmt(n){return Number.isInteger(n)?fmt(n):fmt(Math.round(n*100)/100);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

/* INIT */
function init(){
  if(!S.packing.length)S.packing=JSON.parse(JSON.stringify(DEFAULT_PACKING));
  const hasItin=S.itinerary[1].length||S.itinerary[2].length||S.itinerary[3].length;
  if(!hasItin)S.itinerary=JSON.parse(JSON.stringify(DEFAULT_ITINERARY));
  render();initFbSync();fetchWeather();
}
init();
</script>
